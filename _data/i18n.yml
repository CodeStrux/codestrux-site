# UI / nav / footer strings for the manual bilingual tree.
# Accessed in templates as site.data.i18n[L] where L is page.lang
# ("en" canonical at root, "es-CR" mirrored under /es/).
# Keep both language blocks in sync — every key must exist in both.
#
# NOTE: shell *commands* (ls, cd, cat, help, theme, clear, open) are NOT
# translated — they are a universal shell. Only the human-facing prose is.

en:
  # Label shown on the language switcher (the language you switch TO).
  switch_to: "ES"
  switch_to_full: "Switch to Spanish"
  nav:
    home: "home"
    about: "about"
    services: "services"
    fde: "fde"
    projects: "projects"
  shell:
    # The prompt rendered before command-as-heading kickers, e.g.
    # `codestrux@cartago:~$`. host/user are not localized.
    user: "codestrux"
    host: "cartago"
    menu: "menu"            # touch affordance label for the command palette
    skip: "Skip to content"
    nav_label: "Primary"     # aria-label for the <nav>
  theme:
    toggle: "Toggle theme"   # aria-label / tooltip on the theme button
    dark: "dark"
    light: "paper"
  palette:
    open: "Open command palette"
    placeholder: "Type a command or page name…"
    hint: "to run"           # shown next to the Enter key glyph
    nav_hint: "to move"      # shown next to the arrow keys glyph
    close_hint: "to close"   # shown next to the Esc key glyph
    empty: "No matching command. Try help."
    heading: "Command palette"
    help_title: "Available commands"
  boot:
    # Typewriter line shown once on first paint (reduced-motion shows it static).
    line: "booting codestrux.tech …"
    ready: "ready."
  footer:
    tagline: "A studio from Cartago, Costa Rica. We build and run infrastructure and software."
    legal: "Legal"
    contact: "Contact"
    whatsapp: "WhatsApp"
    nav_heading: "Navigate"
    built: "Built with Jekyll. No trackers."
  legal_links:
    privacy: "Privacy Policy"
    terms: "Terms of Service"
    data_deletion: "Data Deletion"
  # Strings used by _includes/legal-doc.html
  legal_label: "Legal"
  effective: "Effective date"
  data_deletion: "Data Deletion Instructions"

es-CR:
  switch_to: "EN"
  switch_to_full: "Cambiar a inglés"
  nav:
    home: "inicio"
    about: "nosotros"
    services: "servicios"
    fde: "fde"
    projects: "proyectos"
  shell:
    user: "codestrux"
    host: "cartago"
    menu: "menú"
    skip: "Saltar al contenido"
    nav_label: "Principal"
  theme:
    toggle: "Cambiar tema"
    dark: "oscuro"
    light: "papel"
  palette:
    open: "Abrir paleta de comandos"
    placeholder: "Escriba un comando o el nombre de una página…"
    hint: "ejecutar"
    nav_hint: "moverse"
    close_hint: "cerrar"
    empty: "Ningún comando coincide. Pruebe help."
    heading: "Paleta de comandos"
    help_title: "Comandos disponibles"
  boot:
    line: "arrancando codestrux.tech …"
    ready: "listo."
  footer:
    tagline: "Un estudio desde Cartago, Costa Rica. Construimos y operamos infraestructura y software."
    legal: "Legal"
    contact: "Contacto"
    whatsapp: "WhatsApp"
    nav_heading: "Navegar"
    built: "Hecho con Jekyll. Sin rastreadores."
  legal_links:
    privacy: "Política de Privacidad"
    terms: "Términos del Servicio"
    data_deletion: "Eliminación de Datos"
  # Cadenas usadas por _includes/legal-doc.html
