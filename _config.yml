# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: CodeStrux Tech
url: "https://codestrux.tech"
lang: en
author:
  name: CodeStrux Tech
  email: contact@codestrux.tech
description: >- # this means to ignore newlines until "baseurl:"
  CodeStrux Tech is a two-engineer studio in Cartago, Costa Rica. We build and
  run both infrastructure and software — Linux and virtualization, open source,
  cloud and serverless, data pipelines, Java and TypeScript backends and
  frontends, e-invoicing, WhatsApp automation, and AI tooling.
show_excerpts: false # set to true to show excerpts on the homepage
heading: We build and run infrastructure and software.
subheading: >
  CodeStrux Tech is a two-engineer studio from Cartago, Costa Rica. We design, build,
  and operate the whole stack — Linux and virtualization, open source, cloud, data
  pipelines, backends and frontends, e-invoicing, messaging automation, and AI tooling.

# Pages that appear in the English top nav. The Spanish nav is rendered from
# _data/i18n.yml by the local _includes/header.html override, so the /es/*
# mirror never leaks into this list.
header_pages:
  - index.markdown
  - about.markdown
  - services.markdown
  - projects.markdown


# Build settings
# aao: theme: minima
theme: jekyll-nord-theme
plugins:
  - jekyll-feed

jekyll-nord-theme:
  date_format: "%Y-%b-%d"

  # generate social links in footer
  social_links:
    twitter: codestrux
    github:  CodeStrux
    linkedin: alvaroaraya
