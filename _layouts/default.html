<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  {%- include head.html -%}
</head>
{%- assign L = page.lang | default: "en" -%}
{%- assign ui = site.data.i18n[L] | default: site.data.i18n.en -%}
<body class="{{ page.layout }} {{ page.ref }}">
  <a class="skip-link" href="#main">{{ ui.shell.skip }}</a>
  {%- include header.html -%}
  <main id="main" tabindex="-1">
    {{ content }}
  </main>
  {%- include footer.html -%}
  {%- include command-palette.html -%}
  <script src="{{ '/assets/js/terminal.js' | relative_url }}" defer></script>
</body>
</html>
