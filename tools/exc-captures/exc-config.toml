# Demo config for the codestrux.tech capture pipeline.
# Curated from the exc repo's example config.toml; nothing executed on
# camera needs network (captures run under docker --network none).

[meta]
title = "aao@codestrux"
theme = "dark"

# CodeStrux site tokens (converted from assets/css/style.scss OKLCH):
[theme]
accent      = "#42c070"   # --accent  oklch(0.72 0.16 152)
border      = "#2a362e"   # --rule
text        = "#e6ede7"   # --fg
muted       = "#9ea89f"   # --fg-dim
selected_bg = "#42c070"
selected_fg = "#001408"   # --accent-ink

[[profiles]]
name = "system"
label = "System"
description = "Everyday local system commands"

  [[profiles.commands]]
  name = "disk-usage"
  description = "Show disk usage for the current directory"
  command = "du -sh ."

  [[profiles.commands]]
  name = "disk-free"
  description = "Show free space on mounted filesystems"
  command = "df -h"

  [[profiles.commands]]
  name = "top-processes"
  description = "Show the top CPU-consuming processes"
  command = "ps aux | sort -rk 3 | head -n 10"

  [[profiles.commands]]
  name = "top-memory"
  description = "Show the top memory-consuming processes"
  command = "ps aux | sort -rk 4 | head -n 10"

  [[profiles.commands]]
  name = "largest-files"
  description = "List the largest files under a directory"
  command = "du -ah {{dir}} | sort -rh | head -n 8"

    [[profiles.commands.params]]
    name = "dir"
    prompt = "Directory to scan"
    default = "/usr/share/fonts"

  [[profiles.commands]]
  name = "open-ports"
  description = "List listening TCP sockets"
  command = "ss -tlnp"

  [[profiles.commands]]
  name = "print-hosts"
  description = "Print /etc/hosts"
  command = "cat /etc/hosts"

  [[profiles.commands]]
  name = "kernel-info"
  description = "Show kernel and architecture"
  command = "uname -a"

  [[profiles.commands]]
  name = "uptime"
  description = "Show uptime and load average"
  command = "uptime"

[[profiles]]
name = "git"
label = "Git"
description = "Common actions against the current repository"

  [[profiles.commands]]
  name = "git-status"
  description = "Short status of the working tree"
  command = "git status -sb"

  [[profiles.commands]]
  name = "git-log-graph"
  description = "Compact commit graph"
  command = "git log --oneline --graph --decorate -n 30"

  [[profiles.commands]]
  name = "git-clean-branches"
  description = "Prune remote refs, list branches merged into main"
  command = "git fetch --prune; git branch --merged main | grep -v '\\*\\|main'"

  [[profiles.commands]]
  name = "git-checkout-branch"
  description = "Checkout a branch by name"
  command = "git checkout {{branch}}"

    [[profiles.commands.params]]
    name = "branch"
    prompt = "Branch to checkout"
    default = "main"

[[profiles]]
name = "docker"
label = "Docker"
description = "Local container housekeeping"

  [[profiles.commands]]
  name = "docker-ps"
  description = "List running containers"
  command = "docker ps"

  [[profiles.commands]]
  name = "docker-prune"
  description = "Remove stopped containers, dangling images, unused volumes"
  command = "docker container prune -f; docker image prune -f; docker volume prune -f"

  [[profiles.commands]]
  name = "docker-logs"
  description = "Tail logs for a running container"
  command = "docker logs -f --tail 200 {{container}}"

    [[profiles.commands.params]]
    name = "container"
    prompt = "Container name or id"
    default = ""

[[profiles]]
name = "network"
label = "Network"
description = "Connectivity and TLS diagnostics"

  [[profiles.commands]]
  name = "ping-host"
  description = "Ping a host 4 times"
  command = "ping -c 4 {{host}}"

    [[profiles.commands.params]]
    name = "host"
    prompt = "Host to ping"
    default = "1.1.1.1"

  [[profiles.commands]]
  name = "cert-check"
  description = "Check the TLS certificate presented by a remote domain"
  command = "openssl s_client -connect {{domain}}:443 </dev/null 2>/dev/null | openssl x509 -noout -dates -subject"

    [[profiles.commands.params]]
    name = "domain"
    prompt = "Domain to check"
    default = "codestrux.tech"

  [[profiles.commands]]
  name = "dns-lookup"
  description = "Query A/AAAA/MX records for a domain"
  command = "dig +short {{domain}} A AAAA MX"

    [[profiles.commands.params]]
    name = "domain"
    prompt = "Domain to look up"
    default = "codestrux.tech"

[[profiles]]
name = "secrets"
label = "Secrets"
description = "Local crypto helpers"

  [[profiles.commands]]
  name = "gen-password"
  description = "Generate a random password"
  command = "openssl rand -base64 {{length}} | tr -d '\\n'; echo"

    [[profiles.commands.params]]
    name = "length"
    prompt = "Password byte length"
    default = "20"

  [[profiles.commands]]
  name = "gen-hex-secret"
  description = "Generate a random hex secret, e.g. a JWT signing key"
  command = "openssl rand -hex 32"

  [[profiles.commands]]
  name = "random-uuid"
  description = "Generate a random UUID"
  command = "cat /proc/sys/kernel/random/uuid"

[[profiles]]
name = "deploy"
label = "Deploy"
description = "Project-specific deployment tasks"

  [[profiles.commands]]
  name = "deploy-status"
  description = "Check the app service on a staging host"
  command = "ssh {{host}} 'APP_TOKEN={{token}} systemctl status app --no-pager'"

    [[profiles.commands.params]]
    name = "host"
    prompt = "Staging host"
    default = "web-01.codestrux.tech"

    [[profiles.commands.params]]
    name = "token"
    prompt = "Deploy token"
    default = ""
    secret = true

  [[profiles.commands]]
  name = "deploy-staging"
  description = "Deploy the current branch to staging"
  command = "ssh {{deploy_user}}@staging.codestrux.tech 'cd /srv/app && git pull && systemctl restart app'"

    [[profiles.commands.params]]
    name = "deploy_user"
    prompt = "SSH user for staging"
    default = "deploy"

  [[profiles.commands]]
  name = "prod-health-check"
  description = "Authenticated health check against production"
  command = "curl -sS -H \"Authorization: Bearer {{token}}\" https://api.codestrux.tech/health"

    [[profiles.commands.params]]
    name = "token"
    prompt = "Production API token"
    default = ""
    secret = true
